version: '3.8'

# Local SSL Testing with Nginx Reverse Proxy
# This creates a self-signed SSL certificate for testing

services:
  # Nginx with SSL (using self-signed cert for testing)
  nginx-ssl:
    image: nginx:alpine
    container_name: cicd-nginx-ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl-selfsigned.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - app_public:/var/www/html
    networks:
      - ssl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-app-ssl
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    networks:
      - ssl-network
    restart: unless-stopped

  # PostgreSQL (optional - for full functionality)
  postgres:
    image: postgres:15-alpine
    container_name: cicd-postgres-ssl
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    expose:
      - "5432"
    networks:
      - ssl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional - for full functionality)
  redis:
    image: redis:7-alpine
    container_name: cicd-redis-ssl
    expose:
      - "6379"
    networks:
      - ssl-network
    restart: unless-stopped

networks:
  ssl-network:
    name: ssl-network
    driver: bridge

volumes:
  app_public: