# Staging environment values
# Use for staging/pre-production environments

replicaCount: 2

image:
  tag: "staging"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  nodePortEnabled: false
  loadBalancerEnabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  stagingEnabled: true
  stagingHost: "staging.my-first-cicd.example.com"
  hosts:
    - host: staging.my-first-cicd.example.com
      paths:
        - path: /
          pathType: Prefix
          servicePort: 80
  tls:
    - secretName: my-first-cicd-tls-staging
      hosts:
        - staging.my-first-cicd.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

config:
  NODE_ENV: "staging"
  PORT: "3000"
  DB_HOST: "my-first-cicd-postgres-staging"
  DB_PORT: "5432"
  DB_NAME: "appdb_staging"
  REDIS_HOST: "my-first-cicd-redis-staging"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"

secrets:
  DB_USER: "staginguser"
  DB_PASSWORD: "changeme"
  REDIS_PASSWORD: "changeme"
  APP_SECRET: "changeme"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - my-first-cicd
          topologyKey: kubernetes.io/hostname

nodeSelector: {}

tolerations: []