apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-first-cicd.fullname" . }}-config
  labels:
    {{- include "my-first-cicd.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  DB_HOST: {{ .Values.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  REDIS_HOST: {{ .Values.config.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.config.REDIS_PORT | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  METRICS_ENABLED: {{ .Values.config.METRICS_ENABLED | quote }}
---
# ConfigMap for Nginx ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-config
  labels:
    app: nginx-ingress
data:
  proxy-body-size: "10m"
  proxy-connect-timeout: "60"
  proxy-read-timeout: "60"
  proxy-send-timeout: "60"
  use-forwarded-headers: "true"
  enable-underscores-in-headers: "true"