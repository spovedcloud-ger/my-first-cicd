apiVersion: v1
kind: Secret
metadata:
  name: {{ include "my-first-cicd.fullname" . }}-secrets
  labels:
    {{- include "my-first-cicd.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.DB_USER | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.REDIS_PASSWORD | quote }}
  APP_SECRET: {{ .Values.secrets.APP_SECRET | quote }}
---
# Secret for external services (optional - for private registry)
{{- if .Values.imagePullSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "my-first-cicd.fullname" . }}-registry
  labels:
    {{- include "my-first-cicd.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecrets | toJson | b64enc }}
{{- end }}