{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "my-first-cicd.fullname" . }}
  labels:
    {{- include "my-first-cicd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "my-first-cicd.selectorLabels" . | nindent 6 }}
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.config.PORT | default 3000 }}
    # Allow from monitoring (Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.config.PORT | default 3000 }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: {{ include "my-first-cicd.fullname" . }}-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: {{ include "my-first-cicd.fullname" . }}-redis
      ports:
        - protocol: TCP
          port: 6379
{{- end }}