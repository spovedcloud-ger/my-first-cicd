# Kubernetes ConfigMap for my-first-cicd App
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-first-cicd-config
  labels:
    app: my-first-cicd
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "my-first-cicd-postgres"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  REDIS_HOST: "my-first-cicd-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
---
# ConfigMap for Nginx ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-config
  labels:
    app: nginx-ingress
data:
  proxy-body-size: "10m"
  proxy-connect-timeout: "60"
  proxy-read-timeout: "60"
  proxy-send-timeout: "60"
  use-forwarded-headers: "true"
  enable-underscores-in-headers: "true"