# Kubernetes NetworkPolicy for my-first-cicd App
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-first-cicd-app
  labels:
    app: my-first-cicd
spec:
  podSelector:
    matchLabels:
      app: my-first-cicd
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Allow from monitoring (Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: my-first-cicd-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: my-first-cicd-redis
      ports:
        - protocol: TCP
          port: 6379
---
# NetworkPolicy for PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-first-cicd-postgres
  labels:
    app: my-first-cicd
    component: postgres
spec:
  podSelector:
    matchLabels:
      app: my-first-cicd-postgres
  policyTypes:
    - Ingress
  ingress:
    # Allow from app
    - from:
        - podSelector:
            matchLabels:
              app: my-first-cicd
              tier: backend
      ports:
        - protocol: TCP
          port: 5432
---
# NetworkPolicy for Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: my-first-cicd-redis
  labels:
    app: my-first-cicd
    component: redis
spec:
  podSelector:
    matchLabels:
      app: my-first-cicd-redis
  policyTypes:
    - Ingress
  ingress:
    # Allow from app
    - from:
        - podSelector:
            matchLabels:
              app: my-first-cicd
              tier: backend
      ports:
        - protocol: TCP
          port: 6379