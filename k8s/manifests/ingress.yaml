# Kubernetes Ingress for my-first-cicd App
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-first-cicd-ingress
  labels:
    app: my-first-cicd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - my-first-cicd.example.com
      secretName: my-first-cicd-tls
  rules:
    - host: my-first-cicd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-first-cicd-app
                port:
                  number: 80
---
# Ingress for staging
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-first-cicd-ingress-staging
  labels:
    app: my-first-cicd
    environment: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  tls:
    - hosts:
        - staging.my-first-cicd.example.com
      secretName: my-first-cicd-tls-staging
  rules:
    - host: staging.my-first-cicd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-first-cicd-app
                port:
                  number: 80