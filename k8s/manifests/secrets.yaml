# Kubernetes Secrets for my-first-cicd App
apiVersion: v1
kind: Secret
metadata:
  name: my-first-cicd-secrets
  labels:
    app: my-first-cicd
type: Opaque
stringData:
  # Database credentials (replace with actual values or use external secrets)
  DB_USER: "appuser"
  DB_PASSWORD: "changeme"
  DB_ROOT_PASSWORD: "changeme"
  
  # Redis credentials
  REDIS_PASSWORD: "changeme"
  
  # Application secrets
  APP_SECRET: "changeme"
---
# Secret for external services (optional - for cloud providers)
apiVersion: v1
kind: Secret
metadata:
  name: my-first-cicd-external-secrets
  labels:
    app: my-first-cicd
type: kubernetes.io/dockerconfigjson
data:
  # Example: .dockerconfigjson base64 encoded (optional)
  # Uncomment and configure if using private registry
  # .dockerconfigjson: eyJhdXRocyI6eyJnaHIuY28iOnsidXNlcm5hbWUiOiJnaHItb3duZXIiLCJwYXNzd29yZCI6IiIsImVtYWlsIjoiIiwiYXV0aCI6IiJ9fX0=