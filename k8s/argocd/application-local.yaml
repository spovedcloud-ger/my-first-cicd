# ArgoCD Application - my-first-cicd (LOCAL TEST VERSION)
# This version uses local path - for testing without GitHub
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-first-cicd-local
  namespace: argocd
spec:
  project: default
  
  # Source: Local path (for testing)
  source:
    repoURL: https://github.com/spovedcloud-ger/my-first-cicd.git
    targetRevision: HEAD
    path: k8s/helm/my-first-cicd
    helm:
      valueFiles:
        - values-dev.yaml
    
  destination:
    server: https://kubernetes.default.svc
    namespace: my-first-cicd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m