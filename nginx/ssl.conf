# SSL/TLS Configuration for Nginx
# This file contains the SSL directives used by Let's Encrypt (Certbot)

# SSL Certificate Paths (managed by Certbot)
ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

# SSL Session Settings
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# Modern TLS Configuration
ssl_protocols TLSv1.2 TLSv1.3;

# Secure Ciphersuites
# TLS 1.3 ciphersuites (cannot be changed)
ssl_ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

# TLS 1.2 ciphers (server-side preference)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_prefer_server_ciphers off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# HSTS (HTTP Strict Transport Security)
# Uncomment after confirming SSL is working correctly
# max-age: 2 years (63072000 seconds)
# includeSubDomains: include all subdomains
# preload: submit to HSTS preload list
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Additional Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# SSL Curve Settings
ssl_ecdh_curve secp384r1;

# Password-protected private key (if using)
# ssl_password_file /etc/nginx/ssl/passwords;

# === Let's Encrypt Specific Settings ===

# Certificate chain
# Certbot automatically manages this with the following paths:
# - Full chain: /etc/letsencrypt/live/example.com/fullchain.pem
# - Private key: /etc/letsencrypt/live/example.com/privkey.pem
# - Certificate: /etc/letsencrypt/live/example.com/cert.pem
# - Chain: /etc/letsencrypt/live/example.com/chain.pem

# DH Parameters (generate with: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048)
# ssl_dhparam /etc/ssl/certs/dhparam.pem;