name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main, master]

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment info
        run: |
          echo "Staging deployment triggered"
          echo "CI Pipeline completed: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.ref }}"
          echo "To enable deployment, add AWS and EC2 secrets to GitHub repository settings"

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production deployment info
        run: |
          echo "Production deployment triggered"
          echo "CI Pipeline completed: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.ref }}"
          echo "To enable deployment, add AWS and EC2 secrets to GitHub repository settings"

      - name: Show deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ CI Pipeline passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ready for production deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Add AWS secrets to repository settings" >> $GITHUB_STEP_SUMMARY
          echo "2. Add EC2 secrets to repository settings" >> $GITHUB_STEP_SUMMARY
          echo "3. Update this workflow with deployment steps" >> $GITHUB_STEP_SUMMARY