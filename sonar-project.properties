# SonarQube Configuration
# https://docs.sonarqube.org/latest/analysis/scan/sonarscanner-for-github-actions/

sonar.projectKey=my-first-cicd
sonar.projectName=my-first-cicd
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude test files from analysis (they're analyzed separately)
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.spec.js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=node_modules/**,coverage/**,tests/**

# Security rules - enable security hotspots
sonar.security.exclusions.sources=node_modules/**
sonar.security.exclusions.files=node_modules/**,coverage/**

# Quality gates
sonar.qualitygate.wait=true

# Issue exclusions - reduce noise
sonar.issue.ignore.multicriteria=*
sonar.issue.ignore.multicriteria.e1=*