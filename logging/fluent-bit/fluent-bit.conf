[SERVICE]
    # Flush logs every 5 seconds to Elasticsearch
    Flush         5
    # Log level for Fluent Bit itself (info, debug, warn, error)
    Log_Level     info
    # Don't run as a background daemon (docker handles that)
    Daemon        off
    # Custom parsers file
    Parsers_File  /fluent-bit/etc/parsers.conf
    # Enable HTTP server for health checks
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ====================================================
# INPUT: Read logs from Docker container log files
# Docker writes each container's logs to:
# /var/lib/docker/containers/<id>/<id>-json.log
# ====================================================
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    DB                /var/log/fluentbit_docker.db
    Parser            docker
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# ====================================================
# FILTER: Add extra fields to every log record
# ====================================================
[FILTER]
    Name           record_modifier
    Match          *
    Record         app_name   my-first-cicd
    Record         environment docker-compose

# ====================================================
# FILTER: Try to parse log field as JSON
# If the app logs JSON (which we'll set up), this
# will expand the JSON fields so they are searchable
# ====================================================
[FILTER]
    Name            parser
    Match           docker.*
    Key_Name        log
    Parser          json
    Reserve_Data    True
    Preserve_Key    True

# ====================================================
# OUTPUT: Ship logs to Elasticsearch
# ====================================================
[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    # Use Logstash-style daily index pattern
    # Creates: my-first-cicd-logs-YYYY.MM.DD
    Logstash_Format     On
    Logstash_Prefix     my-first-cicd-logs
    Logstash_DateFormat %Y.%m.%d
    # Replace dots in field names (ES doesn't like dots)
    Replace_Dots        On
    # Retry on failure
    Retry_Limit         5
    # Don't fail if ES is temporarily unavailable
    Suppress_Type_Name  On
    # Trace errors for debugging
    Trace_Error         On
